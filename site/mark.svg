<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111923"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="emGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded Institutional Vault Tile -->
  <rect x="20" y="20" width="360" height="360" rx="64" fill="url(#bgPlate)" stroke="#1f2d3d" stroke-width="8"/>
  <rect x="38" y="38" width="324" height="324" rx="48" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Architectural C-Bracket framing the 9-char CUSIP Matrix -->
  <path d="M276 106 H134 C106 106, 92 120, 92 148 V252 C92 280, 106 294, 134 294 H276"
        fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- 6-2-1 CUSIP Bit Matrix inside the C-Frame (6 Issuer bars + 2 Issue bars + Check-Digit Diamond) -->
  <!-- Row 1: 6 Issuer Slots -->
  <rect x="138" y="156" width="16" height="36" rx="3" fill="url(#emGlow)"/>
  <rect x="160" y="156" width="16" height="36" rx="3" fill="url(#emGlow)"/>
  <rect x="182" y="156" width="16" height="36" rx="3" fill="#334155"/>
  <rect x="204" y="156" width="16" height="36" rx="3" fill="url(#emGlow)"/>
  <rect x="226" y="156" width="16" height="36" rx="3" fill="url(#emGlow)"/>
  <rect x="248" y="156" width="16" height="36" rx="3" fill="#334155"/>

  <!-- Row 2: 2 Issue Slots + Separator + Check-Digit Emerald Diamond -->
  <rect x="138" y="208" width="28" height="36" rx="3" fill="#94a3b8"/>
  <rect x="174" y="208" width="28" height="36" rx="3" fill="url(#emGlow)"/>
  <rect x="212" y="222" width="14" height="8" rx="2" fill="#64748b"/>

  <!-- 9th Check-Digit Verification Prism (Right Anchor) -->
  <polygon points="296,164 334,200 296,236 258,200" fill="url(#emGlow)" stroke="#070a0e" stroke-width="6"/>
  <polygon points="296,182 314,200 296,218 278,200" fill="#ecfdf5"/>

  <!-- Top-Right Off-Hours 24/7 Beacon Dot -->
  <circle cx="322" cy="94" r="11" fill="url(#amberAccent)"/>
</svg>