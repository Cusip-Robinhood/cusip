name = "cusip"
main = "src/index.js"
compatibility_date = "2026-11-16"
workers_dev = true

routes = [
  { pattern = "cusipstocks.com", custom_domain = true },
  { pattern = "www.cusipstocks.com", custom_domain = true },
]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/rpc"]

[vars]
CHAIN_ID = "4663"
RH_RPC_URL = "https://rpc.mainnet.chain.robinhood.com"
MULTICALL3 = "0xcA11bde05977b3631167028862bE2a173976CA11"
CUSIP_REGISTRY_ADDRESS = "0x413c216228d4559daf2af1723a73f16613d586a7"
CUSIP_TOKEN_ADDRESS = "0x01db7687276EAe013F287edcb904960116462357"
PRO_THRESHOLD_CUSIP = "500000"
SITE_DOMAIN = "cusipstocks.com"
X_HANDLE = "cusiprobinhood"
